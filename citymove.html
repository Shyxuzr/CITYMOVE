const OS=["Placed","Shop confirmed","Out for delivery","Delivered"],TS=["Requested","Driver accepted","Picked up","Delivered"],H48=48*36e5;

  h=`<div class="sec">`+(S.o.length||S.b.length?S.o.map(o=>`<div class="box rise"><div class="row"><b>Order ${o.id}</b><b>${inr(o.t)}</b></div><small>${o.items.join(", ")}</small><div class="steps">${OS.map((s,k)=>`<i class="${k<=o.st?"d":""}"></i>`).join("")}</div><div class="${o.st==3?"ok":""}">${OS[o.st]}</div><small>Deliver by ${fmt(o.due)} · Delivery code ${o.otp}</small>${o.st==3?stars(o.id,o.r):""}</div>`).join("")+S.b.map(x=>`<div class="box rise"><div class="row"><b>Booking ${x.id}</b><b>${inr(x.f)}</b></div><small>${x.from} to ${x.to} · Pickup code ${x.otp}</small>${road(x.st,x.veh)}<div class="${x.st==3?"ok":""}">${TS[x.st]}</div>${x.st==3?stars(x.id,x.r):""}</div>`).join(""):`<div class="box rise">No activity yet. Orders and bookings appear here with live status.</div>`)+`</div>`;
 }else{const od=S.o.filter(o=>o.st==3),bd=S.b.filter(x=>x.st==3),gs=S.o.reduce((a,o)=>a+o.t,0),gm=bd.reduce((a,x)=>a+x.f,0),cs=gs*.1,cm=gm*.15,mx=Math.max(1,gs,gm);
  h=`<div class="sec"><div class="box rise"><b>Revenue</b><div class="row"><span>Delivery fares</span><b data-p="₹" data-n="${gm}"></b></div><div class="row"><span>CityMove commission</span><b class="ok" data-p="₹" data-n="${cs+cm}"></b></div><div class="bars"><div style="height:${gm/mx*100}%">Move</div><div style="height:${(cs+cm)/mx*100}%">Earned</div></div></div>
  <div class="box rise"><b>Partner actions</b><br><small>Shops and drivers update jobs here.</small>${S.o.filter(o=>o.st<3).map(o=>`<button class="btn alt" data-so="${o.id}">${o.id}: mark ${OS[o.st+1]}</button>`).join("")}${S.b.filter(x=>x.st<3).map(x=>`<button class="btn alt" data-sb="${x.id}">${x.id}: ${["Accept booking","Mark picked up","Complete delivery"][x.st]}</button>`).join("")}${S.o.concat(S.b).every(x=>x.st==3)?`<br><small>No open jobs.</small>`:""}</div><small>Commission: 15% on deliveries. Demo data. No real payments are processed.</small></div>`;}
 const v=$("#v");v.style.setProperty("--dx",(i>=S.prev?24:-24)+"px");if(i!=S.prev||!v.innerHTML){v.classList.remove("enter");void v.offsetWidth;v.classList.add("enter")}S.prev=i;v.innerHTML=h;cnt()}
const id=()=>String(Math.floor(1000+Math.random()*9000));
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.t){S.t=d.t}else if(d.c)S.cat=d.c;else if(d.f){S.fav[d.f]=!S.fav[d.f]}else if(d.a!==undefined){S.cart[d.a]=(S.cart[d.a]||0)+1;toast("Added "+P[d.a].n);const c=$("#cc");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}
 else if(d.m!==undefined){if(--S.cart[d.m]<=0)delete S.cart[d.m]}else if(d.cp!==undefined){S.coupon=$("#cp").value.trim().toUpperCase();toast(S.coupon=="SS10"?"Coupon applied: 10% off":"Coupon not valid")}else if(d.pay)S.pay=d.pay;
 else if(d.place!==undefined){const t=sub()-disc();S.o.unshift({id:"SS-"+id(),items:Object.entries(S.cart).map(([k,q])=>q+"× "+P[k].n),t,due:Date.now()+H48,st:0,otp:id(),r:0});S.cart={};S.coupon="";S.t="act";toast("Order placed")}
 else if(d.v)S.veh=d.v;else if(d.book!==undefined){S.b.unshift({id:"MV-"+id(),veh:S.veh,from:S.from,to:S.to,f:fare(),st:0,otp:id(),r:0});S.t="act";toast("Booking requested")}
 else if(d.so){const o=S.o.find(x=>x.id==d.so);o.st++;toast("Order "+OS[o.st])}else if(d.sb){const x=S.b.find(x=>x.id==d.sb);x.st++;toast("Booking "+TS[x.st])}
 else if(d.r){const[k,n]=d.r.split(":");(S.o.concat(S.b)).find(x=>x.id==k).r=+n;toast("Thanks for rating")}else return;draw()});
document.addEventListener("input",e=>{if(e.target.id=="q"){S.q=e.target.value;const p=e.target.selectionStart;draw();const q=$("#q");q.focus();q.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{if(e.target.id=="f")S.from=e.target.value;else if(e.target.id=="d")S.to=e.target.value;else if(e.target.id!="city")return;draw()});
